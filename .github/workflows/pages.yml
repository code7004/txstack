# 소개 사이트(apps/site)와 Storybook 정적 빌드를 GitHub Pages 에 올린다.
#
#   https://code7004.github.io/txstack/            ← 사이트
#   https://code7004.github.io/txstack/storybook/  ← Storybook
#
# npm 배포와는 별개다. 둘 다 패키지를 소스로 잇기 때문에(vite alias) 패키지 빌드 없이 돈다.
#
# **품질 검사(ci.yml)를 통과해야만 배포한다.** lint · 타입 · 테스트 · 배포 파일 검증 중 하나라도 실패하면
# 빌드도 배포도 하지 않는다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시하면 앞의 배포는 버린다. 마지막 것만 의미가 있다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 저장소 이름이 하위 경로가 된다. basename · 자산 경로가 이 값을 따른다.
      # 빌드가 주소마다 index.html(제목 · 설명 · 공유 카드)과 404.html 을 함께 만든다(apps/site/scripts/share-meta.mjs)
      - run: pnpm site:build
        env:
          SITE_BASE: /txstack/
          SITE_ORIGIN: https://code7004.github.io

      - run: pnpm storybook:build

      - name: 사이트 안에 Storybook 을 싣는다
        run: cp -R apps/storybook/dist apps/site/dist/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
