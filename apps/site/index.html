<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>txstack — 관리 화면과 서비스를 위한 React 라이브러리</title>
    <meta name="description" content="검색 · 목록 · 폼 · 권한별 메뉴 · HTTP 설정처럼 관리 화면마다 다시 짜던 코드를 컴포넌트와 훅, 설정 몇 줄로 줄이는 React 라이브러리입니다." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 링크를 붙여 나눌 때 보이는 것. 포트폴리오에서는 이 카드가 첫인상이다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="txstack" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="txstack — 관리 화면과 서비스를 위한 React 라이브러리" />
    <meta property="og:description" content="여러 프로젝트에서 반복해 쓰던 코드를 재사용할 수 있도록, 쓰기 쉽고 바꾸기 쉽게 만들었습니다." />
    <!-- 큰 그림 카드. 그림(og:image)은 빌드가 배포 주소로 넣는다(scripts/share-meta) -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 첫 그림이 뜨기 전 배경색. 다크에서 흰 화면이 번쩍이지 않게 한다 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1219" />

    <!-- Pretendard — 한글과 라틴이 한 가족으로 돈다. 쓰는 글자 조각만 받는다(dynamic subset).
         CSS 의 @import 로 두면 빌드가 그 앞에 규칙을 붙여 무효가 되므로 여기서 받는다 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
